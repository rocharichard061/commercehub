spring:
  application:
    name: commercehub

  datasource:
    url: jdbc:postgresql://localhost:5432/commercehub
    username: ${DB_USERNAME:commercehub_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080